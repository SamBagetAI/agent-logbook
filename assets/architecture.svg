<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="660" viewBox="0 0 680 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the Logbook sits next to an agent</title>
  <desc>During the run: the world shows the agent a situation, the agent decides and acts, the world answers; what happened is counted by the memory, a program, and its memory block is in every message to the agent. At the end of an episode the agent's context is cleared and the memory kept. Before the run: the agent's own skill says how to read it; the agent spec is read by the memory author, an LLM, which writes the memory code.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="440" rx="16" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="13" font-weight="600" fill="#444441">Before the run</text>
  <g><rect x="190" y="60" width="120" height="52" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/><text x="250" y="82" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">Agent spec</text><text x="250" y="100" font-size="11" fill="#0F6E56" text-anchor="middle">goal and tools</text></g>
  <g><rect x="335" y="60" width="130" height="52" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.8"/><text x="400" y="82" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle">Memory author</text><text x="400" y="100" font-size="11" fill="#534AB7" text-anchor="middle">an LLM, once</text></g>
  <g><rect x="490" y="60" width="150" height="52" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/><text x="565" y="82" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">Memory code</text><text x="565" y="100" font-size="11" fill="#0F6E56" text-anchor="middle">the written program</text></g>
  <line x1="310" y1="86" x2="333" y2="86" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="465" y1="86" x2="488" y2="86" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="565" y1="112" x2="565" y2="198" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="170" width="640" height="220" rx="14" fill="#FAFAF7" stroke="#D3D1C7" stroke-width="0.8"/>
  <text x="36" y="188" font-size="11" fill="#888780">During the run, every step</text>
  <g><rect x="40" y="200" width="150" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/><text x="115" y="231" font-size="13" font-weight="600" fill="#444441" text-anchor="middle">The world</text><text x="115" y="250" font-size="11" fill="#5F5E5A" text-anchor="middle">the task at hand</text></g>
  <g><rect x="250" y="190" width="180" height="90" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.8"/><text x="340" y="221" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">Agent</text><text x="340" y="240" font-size="11" fill="#534AB7" text-anchor="middle">an LLM that decides</text><rect x="262" y="252" width="156" height="18" rx="9" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/><text x="340" y="264.5" font-size="10.5" fill="#085041" text-anchor="middle">its skill: how to read memory</text></g>
  <g><rect x="490" y="200" width="150" height="70" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/><text x="565" y="231" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">Memory = Logbook</text><text x="565" y="250" font-size="11" fill="#0F6E56" text-anchor="middle">a program: counts</text></g>
  <line x1="190" y1="222" x2="248" y2="222" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="219" y="212" font-size="11" fill="#5F5E5A" text-anchor="middle">sees</text>
  <line x1="248" y1="250" x2="192" y2="250" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="219" y="268" font-size="11" fill="#5F5E5A" text-anchor="middle">acts</text>
  <line x1="488" y1="236" x2="432" y2="236" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="460" y="186" font-size="11" fill="#5F5E5A" text-anchor="middle">memory block, in every message</text>
  <path d="M115 270 L115 330 L565 330 L565 272" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="340" y="350" font-size="11" fill="#5F5E5A" text-anchor="middle">what happened, counted</text>
  <text x="340" y="376" font-size="11" fill="#5F5E5A" text-anchor="middle">end of episode: the agent's context is cleared, the memory is kept</text>
  <rect x="40" y="412" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/><text x="62" y="423" font-size="11" fill="#5F5E5A">exists</text>
  <rect x="150" y="412" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/><text x="172" y="423" font-size="11" fill="#5F5E5A">ours</text>
  <rect x="300" y="412" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.8"/><text x="322" y="423" font-size="11" fill="#5F5E5A">an LLM call</text>
</svg>
